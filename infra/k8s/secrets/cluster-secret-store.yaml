# External Secrets Operator wiring (Story 1-9).
#
# This ClusterSecretStore is the provider-neutral interface AC1 demands —
# downstream ExternalSecret manifests reference it by name, not by cloud.
# Swap the `provider:` block to GCP Secret Manager or Azure Key Vault and
# every ExternalSecret keeps working.
#
# Authentication via IRSA (IAM Roles for Service Accounts). The operator's
# ServiceAccount is annotated with an IAM role that has read-only access to
# the fcm/* secret prefix in AWS Secrets Manager (configured out-of-band by
# the operator who bootstrapped the Terraform state).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: fcm-aws
spec:
  provider:
    aws:
      service: SecretsManager
      # us-east-1 default; per-env overlay overrides for regional deployments.
      region: us-east-1
      auth:
        # IRSA: the external-secrets operator's pod is bound to an IAM role
        # with `secretsmanager:GetSecretValue` on fcm/* and `kms:Decrypt` on
        # the per-env CMK (when the CMK story lands — see deferred-work.md).
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets-system
