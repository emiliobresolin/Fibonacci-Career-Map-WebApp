# ExternalSecret that materializes the fcm-api-secrets K8s Secret consumed by
# the Story 1-6 Deployments (api + worker). Both pods read these via
# `secretKeyRef` so when the underlying Secrets Manager value rotates and ESO
# syncs the K8s Secret, the next pod restart picks up the new value — no code
# change required (AC3).
#
# AWS path convention (matches infra/terraform/modules/secrets):
#   fcm/<env>/<suffix>
# The per-env overlay (kustomize / Helm) substitutes the <env> string in
# remoteRefs below at deploy time.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: fcm-api-secrets
spec:
  # Sync from Secrets Manager every hour. Rotation in Secrets Manager flows
  # to the K8s Secret on the next sync; a pod restart (or a fresh
  # rolling-update) materializes the new value into env vars on the next
  # boot. The 1h interval matches typical Secrets Manager rotation cadences.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: fcm-aws
  target:
    name: fcm-api-secrets # consumed by infra/k8s/{api,worker}/deployment.yaml
    creationPolicy: Owner
  data:
    - secretKey: database_url
      remoteRef:
        key: fcm/dev/database_url
    - secretKey: redis_url
      remoteRef:
        key: fcm/dev/redis_url
    - secretKey: s3_bucket
      remoteRef:
        key: fcm/dev/s3_bucket
    - secretKey: s3_region
      remoteRef:
        key: fcm/dev/s3_region
    - secretKey: METRICS_BASIC_AUTH_USER
      remoteRef:
        key: fcm/dev/metrics_basic_auth_user
    - secretKey: METRICS_BASIC_AUTH_PASS
      remoteRef:
        key: fcm/dev/metrics_basic_auth_pass
    - secretKey: SENTRY_DSN
      remoteRef:
        key: fcm/dev/sentry_dsn
    - secretKey: OTEL_EXPORTER_OTLP_ENDPOINT
      remoteRef:
        key: fcm/dev/otel_exporter_otlp_endpoint
