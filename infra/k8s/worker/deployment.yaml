apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcm-worker
  labels:
    app.kubernetes.io/name: fcm
    app.kubernetes.io/component: worker
spec:
  # HPA owns the actual replica count at apply time. Initial value sized for the
  # scoring recalc + outbox-relay + cron schedulers landing in E4 / E9.
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fcm
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcm
        app.kubernetes.io/component: worker
    spec:
      # Workers need MORE grace than the API: in-flight BullMQ jobs must finish or be
      # nacked back to the queue before the pod dies. 60s is the floor; if the scoring
      # recalc job ever exceeds this (NFR-1.4 says ≤30s for one employee), bump up.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fcm-worker
          # Same image as fcm-api — the worker is the SAME container in a
          # different process mode (AC1 of Story 1-6, AD-1). API_MODE below
          # is the only difference between the two deployments.
          image: ghcr.io/objectedge/fcm-api:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          # No containerPort on workers — they don't accept HTTP traffic.
          env:
            - name: API_MODE
              value: "worker"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fcm-api-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: fcm-api-secrets
                  key: redis_url
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: fcm-api-secrets
                  key: s3_bucket
            - name: S3_REGION
              valueFrom:
                secretKeyRef:
                  name: fcm-api-secrets
                  key: s3_region
          envFrom:
            - configMapRef:
                name: fcm-api-config
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
          # Workers have no HTTP, so K8s probes use exec against a heartbeat
          # file (Story 1-8 ships the proper heartbeat writer). Until then,
          # this interim exec probe at least restarts the pod if the Node
          # process disappears — without it, a wedged worker would consume
          # CPU and trigger HPA scale-up without making any progress.
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f 'node .*main.js' >/dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # readinessProbe omitted: workers do not receive traffic.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
      volumes:
        # Same /tmp + cache emptyDirs as the API deployment — Node, Prisma
        # engine, and pino-pretty all need a writable /tmp.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
